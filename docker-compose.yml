services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: labelwise-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labelwise}
      POSTGRES_USER: ${POSTGRES_USER:-labelwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labelwise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labelwise} -d ${POSTGRES_DB:-labelwise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labelwise-api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labelwise-streamlit
    command: streamlit run streamlit_app/app.py --server.port=8501 --server.address=0.0.0.0
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    container_name: labelwise-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Consumed by the provisioned datasource, so credentials stay in .env.
      POSTGRES_DB: ${POSTGRES_DB:-labelwise}
      POSTGRES_USER: ${POSTGRES_USER:-labelwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labelwise}
    ports:
      - "3000:3000"
    volumes:
      # File-based provisioning: the dashboard and datasource exist on first
      # boot with no setup script and no API calls.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  grafana_data: