 apiVersion: 1
 
 # Provisioned automatically at container start. Credentials come from the
 # environment, so no secrets are committed and no setup script is needed.
 datasources:
   - name: LabelWise PostgreSQL
     uid: labelwise-postgres
     type: postgres
     access: proxy
     url: postgres:5432
     database: ${POSTGRES_DB}
     user: ${POSTGRES_USER}
     secureJsonData:
       password: ${POSTGRES_PASSWORD}
     jsonData:
       sslmode: disable
       postgresVersion: 1600
       timescaledb: false
     isDefault: true
     editable: false